plugins { id 'com.android.application' }

android {
    namespace 'com.genfer.pae'
    compileSdk 35
    defaultConfig {
        applicationId 'com.genfer.pae'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '2.0-practica'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes {
        release {
            minifyEnabled false
        }
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}
